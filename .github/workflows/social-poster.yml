name: social-poster

on:
  schedule:
    # IST slots 08:00 / 12:00 / 16:00 / 20:00  ->  UTC 02:30 / 06:30 / 10:30 / 14:30
    - cron: "30 2 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      force_x_test:
        description: "Force a one-off X test post (any value)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: social-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests "tweepy>=4.15"

      - name: Post current slot to Instagram
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: "17841405853168884"
        run: python automation/ig_cloud_post.py

      - name: Post current slot to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FORCE_SLOT: ${{ github.event.inputs.force_x_test }}
        run: python automation/x_cloud_post.py

      - name: Commit posting log
        run: |
          git config user.name "shiwalay-bot"
          git config user.email "shiwalay@gmail.com"
          git add automation/posted-ig.log automation/posted-x.log
          git diff --cached --quiet || git commit -m "log: social post"
          git pull --rebase origin main || true
          git push
