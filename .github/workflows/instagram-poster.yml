name: instagram-poster

on:
  schedule:
    # IST slots 08:00 / 12:00 / 16:00 / 20:00  ->  UTC 02:30 / 06:30 / 10:30 / 14:30
    - cron: "30 2 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post current slot to Instagram
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: "17841405853168884"
        run: python automation/ig_cloud_post.py

      - name: Commit posting log
        run: |
          git config user.name "shiwalay-bot"
          git config user.email "shiwalay@gmail.com"
          git add automation/posted-ig.log
          git diff --cached --quiet || git commit -m "log: instagram post"
          git pull --rebase origin main || true
          git push
